<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>oyannnz.money - Pencatat Keuangan Pribadi</title>
    <!-- Favicon Logo Koin Dolar Neon -->
    <link rel="icon" type="image/jpeg" href="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/2wBDAP//////////////////////////////////////////////////////////////////////////////////////wgALCAABAAEBAREA/8QAFBABAAAAAAAAAAAAAAAAAAAAAP/aAAgBAQABPxA=">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
        .glow-effect {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.12);
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>
<body class="min-h-screen pb-10">
    <!-- Header Kompak Mobile Friendly -->
    <header class="glass-card sticky top-0 z-50 border-b border-slate-800/80 mb-4">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-md shadow-emerald-500/25">
                    <i class="fa-solid fa-wallet text-slate-950 text-sm"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">oyannnz.money</h1>
                    <p class="text-[10px] text-slate-400">Pencatat Keuangan</p>
                </div>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-slate-400 block">Total Saldo</span>
                <span id="headerTotalSaldo" class="text-sm font-bold text-emerald-400">Rp 0</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 space-y-4">
        <!-- Pengaturan Saldo & Alokasi Manual -->
        <section class="glass-card rounded-2xl p-4 glow-effect space-y-3">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold text-slate-200 flex items-center gap-1.5 uppercase tracking-wider">
                    <i class="fa-solid fa-sliders text-emerald-400"></i> Atur Saldo & Anggaran
                </h2>
                <button onclick="saveBudgets()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition shadow-md shadow-emerald-500/20">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> Simpan
                </button>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Total Saldo Utama</label>
                    <input type="text" id="inputTotalSaldo" oninput="formatInputRupiah(this)" placeholder="Contoh: 1.000.000" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Budget Makan</label>
                    <input type="text" id="budgetMakan" oninput="formatInputRupiah(this)" placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Budget Jajan</label>
                    <input type="text" id="budgetJajan" oninput="formatInputRupiah(this)" placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Budget Kebutuhan</label>
                    <input type="text" id="budgetKebutuhan" oninput="formatInputRupiah(this)" placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Budget Tabungan</label>
                    <input type="text" id="budgetTabungan" oninput="formatInputRupiah(this)" placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Budget Saham</label>
                    <input type="text" id="budgetSaham" oninput="formatInputRupiah(this)" placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500 transition">
                </div>
            </div>
        </section>

        <!-- Grid Kategori Sisa Saldo -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2.5">
            <div class="glass-card rounded-xl p-3 border-l-4 border-l-emerald-500">
                <span class="text-[11px] text-slate-400 block">Makan</span>
                <span id="remMakan" class="text-xs font-bold text-slate-100">Rp 0</span>
            </div>
            <div class="glass-card rounded-xl p-3 border-l-4 border-l-teal-400">
                <span class="text-[11px] text-slate-400 block">Jajan</span>
                <span id="remJajan" class="text-xs font-bold text-slate-100">Rp 0</span>
            </div>
            <div class="glass-card rounded-xl p-3 border-l-4 border-l-cyan-400">
                <span class="text-[11px] text-slate-400 block">Kebutuhan</span>
                <span id="remKebutuhan" class="text-xs font-bold text-slate-100">Rp 0</span>
            </div>
            <div class="glass-card rounded-xl p-3 border-l-4 border-l-sky-400">
                <span class="text-[11px] text-slate-400 block">Tabungan</span>
                <span id="remTabungan" class="text-xs font-bold text-slate-100">Rp 0</span>
            </div>
            <div class="glass-card rounded-xl p-3 border-l-4 border-l-indigo-400 col-span-2 sm:col-span-1">
                <span class="text-[11px] text-slate-400 block">Saham</span>
                <span id="remSaham" class="text-xs font-bold text-slate-100">Rp 0</span>
            </div>
        </div>

        <!-- Form Tambah Transaksi & Riwayat -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Form Input -->
            <div class="glass-card rounded-2xl p-4 md:col-span-1 h-fit space-y-3">
                <h2 class="text-xs font-bold text-slate-200 flex items-center gap-1.5 uppercase tracking-wider">
                    <i class="fa-solid fa-circle-plus text-emerald-400"></i> Tambah Transaksi
                </h2>
                
                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Tipe</label>
                    <select id="transType" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="pengeluaran">Pengeluaran (-)</option>
                        <option value="pemasukan">Pemasukan (+)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Kategori</label>
                    <select id="transCategory" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                        <option value="Makan">Makan</option>
                        <option value="Jajan">Jajan</option>
                        <option value="Kebutuhan">Kebutuhan</option>
                        <option value="Tabungan">Tabungan</option>
                        <option value="Saham">Saham</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Nominal (Rp)</label>
                    <input type="text" id="transAmount" oninput="formatInputRupiah(this)" placeholder="Contoh: 20.000" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="text-[11px] font-medium text-slate-400 block mb-1">Keterangan</label>
                    <input type="text" id="transNote" placeholder="Misal: Makan siang" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                </div>

                <button onclick="addTransaction()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-600 hover:to-teal-500 text-slate-950 font-bold py-2 rounded-xl text-xs transition shadow-md shadow-emerald-500/20">
                    Tambah Catatan
                </button>
            </div>

            <!-- Riwayat Transaksi -->
            <div class="glass-card rounded-2xl p-4 md:col-span-2 flex flex-col h-[400px]">
                <div class="flex items-center justify-between pb-2.5 border-b border-slate-800 mb-3">
                    <h2 class="text-xs font-bold text-slate-200 flex items-center gap-1.5 uppercase tracking-wider">
                        <i class="fa-solid fa-clock-rotate-left text-emerald-400"></i> Riwayat Transaksi
                    </h2>
                    <button onclick="deleteAllHistory()" class="bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-[11px] px-2.5 py-1 rounded-lg border border-rose-500/20 transition">
                        <i class="fa-solid fa-trash mr-1"></i> Hapus Semua
                    </button>
                </div>

                <div id="historyList" class="flex-1 overflow-y-auto space-y-2.5 pr-1">
                    <!-- Data riwayat masuk lewat JS -->
                </div>
            </div>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('oyannnz_money_db')) || {
            totalSaldo: 0,
            budgets: { Makan: 0, Jajan: 0, Kebutuhan: 0, Tabungan: 0, Saham: 0 },
            history: []
        };

        function formatRupiah(angka) {
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        function formatInputRupiah(input) {
            let value = input.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);

            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            input.value = rupiah;
        }

        function parseRupiah(str) {
            if (!str) return 0;
            return parseInt(str.toString().replace(/\./g, '')) || 0;
        }

        function initUI() {
            document.getElementById('inputTotalSaldo').value = db.totalSaldo ? db.totalSaldo.toLocaleString('id-ID') : '';
            document.getElementById('budgetMakan').value = db.budgets.Makan ? db.budgets.Makan.toLocaleString('id-ID') : '';
            document.getElementById('budgetJajan').value = db.budgets.Jajan ? db.budgets.Jajan.toLocaleString('id-ID') : '';
            document.getElementById('budgetKebutuhan').value = db.budgets.Kebutuhan ? db.budgets.Kebutuhan.toLocaleString('id-ID') : '';
            document.getElementById('budgetTabungan').value = db.budgets.Tabungan ? db.budgets.Tabungan.toLocaleString('id-ID') : '';
            document.getElementById('budgetSaham').value = db.budgets.Saham ? db.budgets.Saham.toLocaleString('id-ID') : '';

            let spent = { Makan: 0, Jajan: 0, Kebutuhan: 0, Tabungan: 0, Saham: 0, Lainnya: 0 };
            let totalIncome = db.totalSaldo;
            let totalExpense = 0;

            db.history.forEach(item => {
                if (item.type === 'pengeluaran') {
                    if (spent[item.category] !== undefined) spent[item.category] += item.amount;
                    totalExpense += item.amount;
                } else {
                    totalIncome += item.amount;
                }
            });

            let finalSaldo = totalIncome - totalExpense;
            document.getElementById('headerTotalSaldo').innerText = formatRupiah(finalSaldo);

            document.getElementById('remMakan').innerText = formatRupiah((db.budgets.Makan || 0) - spent.Makan);
            document.getElementById('remJajan').innerText = formatRupiah((db.budgets.Jajan || 0) - spent.Jajan);
            document.getElementById('remKebutuhan').innerText = formatRupiah((db.budgets.Kebutuhan || 0) - spent.Kebutuhan);
            document.getElementById('remTabungan').innerText = formatRupiah((db.budgets.Tabungan || 0) - spent.Tabungan);
            document.getElementById('remSaham').innerText = formatRupiah((db.budgets.Saham || 0) - spent.Saham);

            renderHistory();
        }

        function saveBudgets() {
            db.totalSaldo = parseRupiah(document.getElementById('inputTotalSaldo').value);
            db.budgets.Makan = parseRupiah(document.getElementById('budgetMakan').value);
            db.budgets.Jajan = parseRupiah(document.getElementById('budgetJajan').value);
            db.budgets.Kebutuhan = parseRupiah(document.getElementById('budgetKebutuhan').value);
            db.budgets.Tabungan = parseRupiah(document.getElementById('budgetTabungan').value);
            db.budgets.Saham = parseRupiah(document.getElementById('budgetSaham').value);
            
            localStorage.setItem('oyannnz_money_db', JSON.stringify(db));
            initUI();
            alert('Pengaturan saldo & anggaran berhasil disimpan!');
        }

        function addTransaction() {
            const type = document.getElementById('transType').value;
            const category = document.getElementById('transCategory').value;
            const amount = parseRupiah(document.getElementById('transAmount').value);
            const note = document.getElementById('transNote').value || category;

            if (!amount || amount <= 0) {
                alert('Masukkan nominal uang dengan benar!');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

            db.history.unshift({
                id: Date.now(),
                type,
                category,
                amount,
                note,
                date: dateStr
            });

            localStorage.setItem('oyannnz_money_db', JSON.stringify(db));
            document.getElementById('transAmount').value = '';
            document.getElementById('transNote').value = '';
            initUI();
        }

        function deleteTransaction(id) {
            db.history = db.history.filter(item => item.id !== id);
            localStorage.setItem('oyannnz_money_db', JSON.stringify(db));
            initUI();
        }

        function deleteAllHistory() {
            if (confirm('Yakin ingin menghapus seluruh riwayat transaksi?')) {
                db.history = [];
                localStorage.setItem('oyannnz_money_db', JSON.stringify(db));
                initUI();
            }
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if (db.history.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-500 text-xs">Belum ada riwayat transaksi tercatat.</div>`;
                return;
            }

            list.innerHTML = db.history.map(item => `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-900/60 border border-slate-800/80">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center ${item.type === 'pemasukan' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                            <i class="fa-solid ${item.type === 'pemasukan' ? 'fa-arrow-down' : 'fa-arrow-up'} text-xs"></i>
                        </div>
                        <div>
                            <h4 class="text-xs font-bold text-slate-200">${item.note}</h4>
                            <span class="text-[10px] text-slate-400">${item.category} • ${item.date}</span>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2.5">
                        <span class="text-xs font-bold ${item.type === 'pemasukan' ? 'text-emerald-400' : 'text-slate-200'}">
                            ${item.type === 'pemasukan' ? '+' : '-'} ${formatRupiah(item.amount)}
                        </span>
                        <button onclick="deleteTransaction(${item.id})" class="text-slate-500 hover:text-rose-400 p-1 transition">
                            <i class="fa-solid fa-trash text-[11px]"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = initUI;
    </script>
</body>
</html>
